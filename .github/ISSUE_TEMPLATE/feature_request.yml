name: 💡 功能建议 Feature request
description: 提出新功能或改进建议。Suggest an idea or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎建议！新增用户可见参数需要不破坏既有行为——请先描述需求本身，再谈设计。
        Ideas are welcome! New user-facing options should fit the current command line without breaking existing behavior — describe the need first, the design later.
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 What need this addresses
      description: 你想完成什么、当前差在哪。What you are trying to do, and where the tool falls short.
      placeholder: 作为……，我希望……，以便……。 As a user of ..., I want ..., so that ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议的方案 Proposed solution
      description: 可选，参数与行为草图即可。Optional — a sketch of flags/behavior is fine.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代做法 Alternatives considered
      description: 现有参数能否绕路实现。Whether existing options can work around it.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块 Area
      multiple: true
      options:
        - 扫描与缓存 scanning/cache
        - 动作与回滚 actions (move/delete/undo)
        - 命令行参数 command line
        - 文档 docs
        - 测试或 CI tests/CI
        - 其他 other
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 Before submitting
      options:
        - label: 已搜索过相似建议。I searched existing issues for the same idea.
          required: true
