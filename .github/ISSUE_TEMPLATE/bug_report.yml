name: 🐞 缺陷反馈 Bug report
description: 报告一个可复现的问题。Report a reproducible problem with DupFinder.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢抽出时间反馈！请先用 `--try-run` 演练模式收敛一个最小复现——它不改动任何文件，通常也足以定位问题。
        Thanks for taking the time to report this! Please try a minimal reproduction with `--try-run` first — it changes nothing on disk and usually makes the problem easy to isolate.
  - type: textarea
    id: summary
    attributes:
      label: 问题现象 What happened
      description: 实际发生了什么、与预期有何不同。Actual behavior versus what you expected.
      placeholder: 简要描述问题。Briefly describe the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤 Reproduction
      description: >-
        请给出完整命令行与最小目录结构（示例请用中性名称如 dir_a/、dir_b/，粘贴前删除个人路径）。
        Share the exact command line plus a minimal directory layout (use neutral example names such as dir_a/, dir_b/; redact personal paths before pasting).
      render: shell
      placeholder: |
        python dup_finder.py -d dir_a/ dir_b/ --action move -m trash/
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境 Environment
      description: 操作系统、Python 版本、程序版本或提交号。OS, Python version, DupFinder version or commit.
      value: |
        - 操作系统 OS:
        - Python:
        - DupFinder 版本或提交 version or commit:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志 Relevant log lines
      description: >-
        控制台或 logs/DupFinder.log 中的里程碑/告警行；粘贴前请删除个人路径。
        Milestone or warning lines from the console or logs/DupFinder.log. Redact any personal paths first.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 Before submitting
      options:
        - label: 已删除个人路径与敏感信息。I redacted personal paths and sensitive data.
          required: true
        - label: 已搜索过相似 issue。I searched existing issues for duplicates.
