name: 💡 Feature request · 功能建议
description: Suggest an idea or improvement · 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome! New user-facing options should fit the current
        command line without breaking existing behavior — describe the need
        first, the design later. 欢迎建议！新增用户可见参数需要不破坏既有行为——
        请先描述需求本身，再谈设计。
  - type: textarea
    id: problem
    attributes:
      label: What need does this address · 想解决的问题 / 使用场景
      description: What you are trying to do and where the tool falls short · 你想完成什么、当前差在哪
      placeholder: As a user of..., I want..., so that... 作为……，我希望……，以便……
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution · 建议的方案
      description: Optional — a sketch of flags/behavior is fine · 可选，参数与行为草图即可
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered · 考虑过的替代做法
      description: Workarounds with existing options, if any · 现有参数能否绕路实现
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area · 涉及模块
      multiple: true
      options:
        - scanning / 扫描与缓存
        - actions (move/delete/undo) / 动作与回滚
        - CLI surface / 命令行参数
        - docs / 文档
        - tests or CI / 测试或 CI
        - other / 其他
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting · 提交前确认
      options:
        - label: I searched existing issues for the same idea · 已搜索过相似建议
          required: true
